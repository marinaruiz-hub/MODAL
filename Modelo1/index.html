<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modais</title>
    <link rel="shortcut icon" href="assets/favicon-16x16.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
 
</head>
<body>
    <h1>
        Viagens ✈︎
    </h1>
    <main class="galeria">
            <img src="assets/TajMahal-India.jpg" alt="TajMahal - India" class="miniatura">
            <img src="assets/Santorini-Grecia.jpg" alt="Santorini - Grecia" class="miniatura">
            <img src="assets/AuroraBoreal.jpg" alt="AuroraBoreal - Finlandia" class="miniatura">
            <img src="assets/MonteFuji.jpg" alt="MonteFuji - Japao" class="miniatura">
    </main>
 
    <div id="modal" class="modal">
        <button id="fechar" class="fechar">
            &times;
        </button>
        <div class="modal-conteudo">
            <img src="" alt="imagem-ampliada" class="imagemModal">
            <p id="nomeImagem"></p>
        </div>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
